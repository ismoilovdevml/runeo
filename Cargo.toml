[package]
name = "runeo"
version = "1.0.0"
edition = "2021"
authors = ["Otabek Ismoilov <ismoilovdevml@gmail.com>"]
description = "Aqlli terminal chatbot - OpenAI GPT bilan ishlaydi"
license = "MIT"
repository = "https://github.com/ismoilovdevml/runeo"
keywords = ["cli", "chatbot", "openai", "gpt", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI utilities
spinners = "4.1"
colored = "2.1"

# Environment & Config
dotenvy = "0.15"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Graceful shutdown
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
